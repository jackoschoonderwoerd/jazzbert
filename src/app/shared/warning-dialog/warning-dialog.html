<div class="container">

    <p [innerHTML]="data.message"></p>

    <div class="buttons">
        @if(data.cancel) {

        <button mat-button
            (click)="cancel()">Cancel</button>
        }
        <button mat-raised-button
            color="warn"
            (click)="ok()">OK</button>
    </div>
</div>
