<section class="wrapper">
    <p>
        <a routerLink="/concerts">← Back to concerts</a>
    </p>

    @if (loading()) {
    <p>Loading artist...</p>
    } @else if (!artist()) {
    <p>Artist not found.</p>
    } @else {
    <h1>{{ artist()!.name }}</h1>

    @if (artist()!.imageUrl) {
    <p>
        <img [src]="artist()!.imageUrl"
            [alt]="artist()!.name"
            style="max-width: 320px; width: 100%; height: auto; border: 1px solid #ddd;" />
    </p>
    }

    <section style="margin-bottom: 1rem;">
        <h2>Instruments</h2>
        <p>{{ artist()!.instruments.join(', ') }}</p>
    </section>

    <section style="margin-bottom: 1rem;">
        <h2>Biography</h2>

        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
            <button type="button"
                (click)="setLanguage('nl')"
                [disabled]="language() === 'nl'">
                NL
            </button>
            <button type="button"
                (click)="setLanguage('en')"
                [disabled]="language() === 'en'">
                EN
            </button>
        </div>

        <!-- <p style="white-space: pre-wrap;">
            {{ currentBiography() }}
        </p> -->

        <div [innerHTML]="currentBiography()"></div>
    </section>
    }
</section>
